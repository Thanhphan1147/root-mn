<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light" />
<meta name="description" content="Root Machine Notation — a serverless rules engine and analysis bench for the board game ROOT." />
<title>Root Machine Notation · ROOT analysis bench</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <h1>Root Machine Notation</h1>
      <p class="sub">ROOT · base game · rules engine &amp; analysis bench</p>
    </div>
    <div class="turnbar" id="turnbar" aria-live="polite"></div>
    <div class="topactions">
      <button id="toggleplayers" class="btn ghost" type="button" aria-controls="players" aria-expanded="false">Players</button>
      <button id="autosetup" class="btn ghost" type="button">Quick setup</button>
      <button id="newgame" class="btn ghost" type="button">New manual setup</button>
    </div>
  </div>
</header>

<div class="drawer-backdrop" id="drawerbackdrop" hidden></div>

<main class="bench">
  <aside class="players" id="players" aria-label="Players"></aside>

  <section class="boardwrap">
    <div class="minimap" id="minimap" aria-label="Clearing graph" role="img"></div>
    <div class="board" id="board" aria-label="Woodland map"></div>
    <div class="boardfoot" id="boardfoot"></div>
  </section>

  <section class="rightcol">
    <div class="panel">
      <div class="panel-head"><h2 id="actionhead">Actions</h2><span class="hint" id="pendhint"></span></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Logs</h2><span class="hint">human-readable events</span></div>
      <ol class="log" id="log"></ol>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Annotations</h2><span class="hint">Root Machine Notation</span></div>
      <ol class="rmn" id="rmn"></ol>
    </div>
  </section>
</main>

<footer class="sitefoot">
  <span>Unofficial fan project — not affiliated with Leder Games.</span>
  <a href="https://github.com/Thanhphan1147/root-mn" target="_blank" rel="noopener">github.com/Thanhphan1147/root-mn</a>
</footer>

<script src="wasm_exec.js"></script>
<script src="app.js"></script>
</body>
</html>
